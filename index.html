<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A6CFF">
<title>数独</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#FAFAF9; --panel:#FFFFFF; --line:#DEDEE2; --line-thick:#B9B9C2;
    --given:#1C1C1E; --user:#0A6CFF; --notes:#9A9AA2; --peer:#F1F3F8; --same:#DDEBFF;
    --selected:#CFE2FF; --error:#E0483E; --success:#2FA860; --muted:#8A8A93;
    --btn:#FFFFFF; --btn-text:#1C1C1E; --btn-active:#EFEFF3;
    --shadow:0 1px 2px rgba(20,20,30,.06),0 8px 24px rgba(20,20,30,.05);
    --radius:14px; --fontScale:1; color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#000000; --panel:#111113; --line:#2C2C2F; --line-thick:#48484C;
    --given:#F2F2F5; --user:#4FA3FF; --notes:#7C7C84; --peer:#1A1B20; --same:#183255;
    --selected:#1F3F70; --error:#FF5A4E; --success:#38C172; --muted:#7C7C84;
    --btn:#1C1C1E; --btn-text:#F2F2F5; --btn-active:#2A2A2D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
  html[data-theme="mono"]{
    --bg:#FFFFFF; --panel:#FFFFFF; --line:#CFCFCF; --line-thick:#000000;
    --given:#000000; --user:#000000; --notes:#8A8A8A; --peer:#F0F0F0; --same:#E0E0E0;
    --selected:#D2D2D2; --error:#000000; --success:#000000; --muted:#6E6E6E;
    --btn:#FFFFFF; --btn-text:#000000; --btn-active:#E8E8E8;
    --shadow:0 0 0 1px #000; --radius:10px; color-scheme:light;
  }
  html.hc{ --line:#000; --line-thick:#000; --muted:#444; }
  html.hc[data-theme="dark"]{ --line:#fff; --line-thick:#fff; --muted:#ccc; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--given);
    font-family:-apple-system,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",sans-serif;
    overflow:hidden; touch-action:manipulation;
  }
  button{font-family:inherit;}
  #app{height:100%; display:flex; flex-direction:column;}

  /* ---------- Start screen ---------- */
  #startScreen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:8px; position:relative;}
  .topIcons{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:18px; right:18px; display:flex; justify-content:space-between;}
  .brand{ font-size:15px; letter-spacing:.28em; color:var(--muted); font-weight:600; text-transform:uppercase; margin-bottom:2px;}
  .title{ font-size:56px; font-weight:700; letter-spacing:-.02em; margin:0 0 6px 0; font-variant-numeric:tabular-nums;}
  .subtitle{color:var(--muted); font-size:15px; margin-bottom:8px;}
  #userLevel{ font-size:12px; color:var(--user); font-weight:700; margin-bottom:28px; letter-spacing:.04em;}
  .diff-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:340px;}
  .diff-btn{ padding:20px 10px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel);
    box-shadow:var(--shadow); font-size:17px; font-weight:600; color:var(--given); display:flex; flex-direction:column; align-items:center; gap:4px;}
  .diff-btn small{font-weight:400; color:var(--muted); font-size:12px;}
  .diff-btn:active{ transform:scale(.96); background:var(--btn-active);}
  .row-btns{ display:flex; gap:10px; width:100%; max-width:340px; margin-top:12px;}
  .flatBtn{ flex:1; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--given);
    font-size:14px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; gap:6px;}
  .flatBtn:active{background:var(--btn-active); transform:scale(.97);}
  #continueBtn{ margin-top:14px; width:100%; max-width:340px; padding:14px; border-radius:12px; border:none;
    background:var(--user); color:#fff; font-size:16px; font-weight:600; box-shadow:var(--shadow); display:none;}
  html[data-theme="mono"] #continueBtn{ background:#000; }
  #continueBtn:active{opacity:.85;}
  .iconBtn{ width:38px;height:38px;border-radius:50%; border:1px solid var(--line); background:var(--panel);
    font-size:16px; display:flex; align-items:center; justify-content:center; color:var(--given); box-shadow:var(--shadow);}
  .iconBtn:active{background:var(--btn-active);}

  /* ---------- Game screen ---------- */
  #gameScreen{ flex:1; display:none; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #hud{ display:flex; flex-direction:column; align-items:center; }
  #diffLabel{ font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.08em; text-transform:uppercase;}
  #timer{ font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }

  #boardWrap{ display:flex; justify-content:center; margin:4px 0 12px; position:relative;}
  #board{ display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr);
    width:min(100%, 480px); aspect-ratio:1/1; background:var(--panel); border-radius:12px; overflow:hidden;
    box-shadow:var(--shadow); border:2px solid var(--line-thick);}
  .cell{ display:flex; align-items:center; justify-content:center; position:relative;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    font-size:calc(clamp(16px,4.6vw,22px) * var(--fontScale)); font-weight:400; color:var(--user);
    font-variant-numeric:tabular-nums; user-select:none;}
  .cell:nth-child(9n){border-right:none;}
  .cell:nth-child(n+73){border-bottom:none;}
  .cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:2px solid var(--line-thick);}
  .cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--line-thick);}
  .cell.given{ color:var(--given); font-weight:700; }
  .cell.peer{ background:var(--peer); }
  .cell.same-number{ background:var(--same); }
  .cell.selected{ background:var(--selected); }
  .cell.error{ color:var(--error) !important; }
  html[data-theme="mono"] .cell.error{ text-decoration:underline; text-underline-offset:3px; }
  .cell.pop .val{ animation:pop .16s ease; }
  @keyframes pop{ from{transform:scale(.55); opacity:.3;} to{transform:scale(1); opacity:1;} }
  .noteGrid{ position:absolute; inset:2px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);}
  .noteGrid span{ display:flex; align-items:center; justify-content:center; font-size:calc(clamp(8px,2vw,10px) * var(--fontScale)); color:var(--notes); font-weight:600;}
  .noteGrid.auto span{ opacity:.55; font-style:italic;}
  #pauseOverlay{ position:absolute; inset:0; background:var(--panel); border-radius:12px; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:8px; z-index:5;}
  #pauseOverlay span{ font-weight:700; font-size:16px;} #pauseOverlay small{color:var(--muted); font-size:12px;}

  #toolbar{ display:flex; justify-content:space-around; margin-bottom:12px; }
  .toolBtn{ display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--given);
    font-size:11px; font-weight:600; padding:4px 8px; position:relative;}
  .toolBtn .ic{ width:44px;height:44px;border-radius:50%; background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:var(--shadow);}
  .toolBtn.active .ic{ background:var(--user); color:#fff; border-color:var(--user); }
  html[data-theme="mono"] .toolBtn.active .ic{ background:#000; }
  .toolBtn:disabled{ opacity:.35; }
  .toolBtn:active .ic{ transform:scale(.92); }
  .armedDot{ position:absolute; top:0; right:2px; width:9px;height:9px;border-radius:50%; background:var(--user);}

  #keypad{ display:grid; grid-template-columns:repeat(9,1fr); gap:6px; margin-top:auto; }
  .numBtn{ aspect-ratio:1/1; border-radius:10px; border:1px solid var(--line); background:var(--panel);
    font-size:calc(clamp(15px,4vw,20px) * var(--fontScale)); font-weight:600; color:var(--given); box-shadow:var(--shadow);}
  .numBtn:active{ background:var(--btn-active); transform:scale(.94); }
  .numBtn.done{ opacity:.28; pointer-events:none; box-shadow:none; }
  .numBtn.armed{ background:var(--user); color:#fff; }
  html[data-theme="mono"] .numBtn.armed{ background:#000; }

  /* ---------- Overlays / modals ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.42); display:none; align-items:flex-end; justify-content:center; z-index:50; animation:fade .2s ease;}
  .modal-overlay.center{ align-items:center; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  .sheet{ background:var(--panel); border-radius:20px 20px 0 0; padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 18px);
    width:100%; max-width:480px; max-height:82vh; overflow-y:auto; animation:slideUp .25s ease;}
  @keyframes slideUp{ from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;} }
  .card{ background:var(--panel); border-radius:20px; padding:28px 24px; width:min(88%,360px); text-align:center; box-shadow:var(--shadow); animation:pop .3s ease; max-height:82vh; overflow-y:auto;}
  .sheet h3, .card h2{ margin:0 0 14px; font-size:19px; }
  .sheet-handle{ width:36px; height:4px; background:var(--line-thick); border-radius:2px; margin:0 auto 14px; }
  .settingRow{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
  .settingRow:last-child{ border-bottom:none; }
  .settingRow .label{ font-size:15px; } .settingRow .desc{ font-size:12px; color:var(--muted); margin-top:2px;}
  .switch{ width:46px; height:28px; border-radius:14px; background:var(--line); position:relative; border:none; flex:none;}
  .switch.on{ background:var(--user); } html[data-theme="mono"] .switch.on{ background:#000; }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on::after{ transform:translateX(18px); }
  .seg{ display:flex; background:var(--peer); border-radius:10px; padding:3px; gap:3px;}
  .seg button{ flex:1; padding:8px 4px; border:none; background:none; border-radius:8px; font-size:13px; font-weight:600; color:var(--given);}
  .seg button.on{ background:var(--panel); box-shadow:var(--shadow); }
  .menuList{ display:flex; flex-direction:column; gap:8px; }
  .menuList button{ width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--panel);
    font-size:15px; font-weight:600; color:var(--given); text-align:left; display:flex; align-items:center; gap:10px;}
  .menuList button:active{ background:var(--btn-active); }
  .closeSheetBtn{ margin-top:14px; width:100%; padding:14px; border-radius:12px; border:none; background:var(--peer); color:var(--given); font-weight:600; font-size:15px;}

  #winCard p{ margin:0 0 22px; color:var(--muted); font-size:14px; }
  #winStats{ display:flex; justify-content:space-around; margin-bottom:18px; }
  #winStats div{ display:flex; flex-direction:column; }
  #winStats span:first-child{ font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  #winStats span:last-child{ font-size:11px; color:var(--muted); margin-top:2px; }
  #winAch{ font-size:12px; color:var(--success); font-weight:700; min-height:16px; margin-bottom:14px;}
  #winCard .primaryBtn, .primaryBtn{ width:100%; padding:14px; border-radius:12px; border:none; background:var(--user); color:#fff; font-size:15px; font-weight:600; margin-bottom:8px;}
  html[data-theme="mono"] .primaryBtn{ background:#000; }
  .secondaryBtn{ width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--given); font-size:15px; font-weight:600;}

  .statBlock{ background:var(--peer); border-radius:14px; padding:16px; margin-bottom:12px; text-align:left;}
  .statBlock h4{ margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  .statGrid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .statGrid div{ display:flex; flex-direction:column; }
  .statGrid span:first-child{ font-size:18px; font-weight:700; font-variant-numeric:tabular-nums;}
  .statGrid span:last-child{ font-size:11px; color:var(--muted); }
  .achRow{ display:flex; align-items:center; gap:10px; padding:9px 0; text-align:left; }
  .achRow .dot{ width:34px;height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; background:var(--line); flex:none;}
  .achRow.unlocked .dot{ background:var(--user); color:#fff;} html[data-theme="mono"] .achRow.unlocked .dot{background:#000;}
  .achRow .t{ font-size:14px; font-weight:600; } .achRow .d{ font-size:11px; color:var(--muted);}
  .lbRow{ display:flex; justify-content:space-between; padding:8px 0; font-size:14px; border-bottom:1px solid var(--line);}
  .lbRow:last-child{border-bottom:none;}
  .lbRow .rank{ color:var(--muted); width:22px; }

  #genOverlay{ position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:60; flex-direction:column; gap:14px;}
  .spinner{ width:26px;height:26px;border-radius:50%; border:3px solid var(--line); border-top-color:var(--user); animation:spin .7s linear infinite; }
  html[data-theme="mono"] .spinner{ border-top-color:#000; }
  @keyframes spin{ to{transform:rotate(360deg);} }
  #genOverlay p{ color:var(--muted); font-size:14px; }

  #tutOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:70;}
  #tutCard{ background:var(--panel); border-radius:20px; padding:26px 22px; width:min(86%,340px); text-align:center;}
  #tutCard .step{ font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px;}
  #tutCard h3{ margin:0 0 8px; font-size:18px;}
  #tutCard p{ color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.5;}
  #tutDots{ display:flex; justify-content:center; gap:6px; margin-bottom:16px;}
  #tutDots span{ width:6px;height:6px;border-radius:50%; background:var(--line);}
  #tutDots span.on{ background:var(--user);} html[data-theme="mono"] #tutDots span.on{background:#000;}

  .toast{ position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); left:50%; transform:translateX(-50%);
    background:var(--given); color:var(--bg); padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600;
    z-index:80; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">

  <div id="startScreen">
    <div class="topIcons">
      <button id="settingsBtnStart" class="iconBtn" aria-label="设置">⚙️</button>
      <button id="themeToggleStart" class="iconBtn" aria-label="切换主题">🌙</button>
    </div>
    <div class="brand">MINIMAL</div>
    <h1 class="title">数独</h1>
    <div class="subtitle">选择难度，开始一局</div>
    <div id="userLevel">新手 · 已完成 0 局</div>
    <div class="diff-grid">
      <button class="diff-btn" data-diff="easy">简单<small>入门友好</small></button>
      <button class="diff-btn" data-diff="medium">中等<small>综合推理</small></button>
      <button class="diff-btn" data-diff="hard">困难<small>多步推理</small></button>
      <button class="diff-btn" data-diff="expert">专家<small>高级技巧</small></button>
    </div>
    <div class="row-btns">
      <button class="flatBtn" id="dailyBtn">📅 每日挑战</button>
      <button class="flatBtn" id="statsBtn">🏆 统计成就</button>
    </div>
    <button id="continueBtn"></button>
  </div>

  <div id="gameScreen">
    <header>
      <button id="backBtn" class="iconBtn" aria-label="返回">‹</button>
      <div id="hud">
        <div id="diffLabel">简单</div>
        <div id="timer">00:00</div>
      </div>
      <button id="menuBtn" class="iconBtn" aria-label="菜单">⋯</button>
    </header>

    <div id="boardWrap">
      <div id="board" role="grid" aria-label="数独棋盘"></div>
      <div id="pauseOverlay"><span>已暂停</span><small>点击继续</small></div>
    </div>

    <div id="toolbar">
      <button class="toolBtn" id="undoBtn" aria-label="撤销"><span class="ic">↺</span>撤销</button>
      <button class="toolBtn" id="redoBtn" aria-label="重做"><span class="ic">↻</span>重做</button>
      <button class="toolBtn" id="eraseBtn" aria-label="删除"><span class="ic">⌫</span>删除</button>
      <button class="toolBtn" id="modeBtn" aria-label="模式"><span class="ic">✎</span>笔记</button>
      <button class="toolBtn" id="hintBtn" aria-label="提示"><span class="ic">💡</span>提示</button>
    </div>

    <div id="keypad"></div>
  </div>

  <!-- Win overlay -->
  <div class="modal-overlay center" id="winOverlay">
    <div class="card" id="winCard">
      <h2>完成！</h2>
      <p id="winSub">数独已解开</p>
      <div id="winStats">
        <div><span id="winTime">00:00</span><span>用时</span></div>
        <div><span id="winHints">0</span><span>提示</span></div>
        <div><span id="winMistakes">0</span><span>错误</span></div>
      </div>
      <div id="winAch"></div>
      <button class="primaryBtn" id="winNewGame">再来一局</button>
      <button class="secondaryBtn" id="winShare">分享成绩</button>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="modal-overlay" id="settingsOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>设置</h3>
      <div class="settingRow"><div class="label">主题</div>
        <div class="seg" id="themeSeg" style="flex:1; margin-left:20px;">
          <button data-v="light">白昼</button><button data-v="dark">深色</button><button data-v="mono">黑白</button>
        </div>
      </div>
      <div class="settingRow"><div><div class="label">音效</div><div class="desc">输入 / 完成时播放提示音</div></div><button class="switch" id="soundSwitch"></button></div>
      <div class="settingRow"><div><div class="label">震动</div><div class="desc">冲突与完成时震动反馈</div></div><button class="switch" id="vibSwitch"></button></div>
      <div class="settingRow"><div><div class="label">错误检测</div><div class="desc">实时标红同行/列/宫冲突</div></div><button class="switch" id="errSwitch"></button></div>
      <div class="settingRow"><div><div class="label">自动候选</div><div class="desc">空格自动显示可能的数字</div></div><button class="switch" id="autoSwitch"></button></div>
      <div class="settingRow"><div><div class="label">高对比度</div><div class="desc">加强线条与文字对比</div></div><button class="switch" id="hcSwitch"></button></div>
      <div class="settingRow"><div class="label">字体大小</div>
        <div class="seg" id="fontSeg" style="flex:1; margin-left:20px;">
          <button data-v="1">标准</button><button data-v="1.15">较大</button><button data-v="1.3">最大</button>
        </div>
      </div>
      <button class="closeSheetBtn" id="closeSettings">完成</button>
    </div>
  </div>

  <!-- In-game menu sheet -->
  <div class="modal-overlay" id="menuOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>操作模式</h3>
      <div class="seg" id="opModeSeg" style="margin-bottom:16px;">
        <button data-v="normal">普通</button><button data-v="notes">笔记</button><button data-v="quick">快速</button>
      </div>
      <div class="menuList">
        <button id="pauseBtn">⏸️ 暂停游戏</button>
        <button id="checkBtn">✅ 检查当前填写</button>
        <button id="revealBtn">👁️ 查看完整答案</button>
        <button id="settingsBtnGame">⚙️ 设置</button>
      </div>
      <button class="closeSheetBtn" id="closeMenu">关闭</button>
    </div>
  </div>

  <!-- Stats / achievements sheet -->
  <div class="modal-overlay" id="statsOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>统计与成就</h3>
      <div class="statBlock">
        <h4>总览</h4>
        <div class="statGrid">
          <div><span id="stTotal">0</span><span>完成局数</span></div>
          <div><span id="stStreak">0</span><span>连续天数</span></div>
          <div><span id="stMistakes">0</span><span>累计错误</span></div>
        </div>
      </div>
      <div class="statBlock">
        <h4>各难度最快用时（本机）</h4>
        <div id="bestTimesList" style="font-size:13px;"></div>
      </div>
      <div class="statBlock">
        <h4>本机排行榜</h4>
        <div class="seg" id="lbDiffSeg" style="margin-bottom:8px;">
          <button data-v="easy">简单</button><button data-v="medium">中等</button><button data-v="hard">困难</button><button data-v="expert">专家</button>
        </div>
        <div id="lbList"></div>
      </div>
      <div class="statBlock">
        <h4>成就</h4>
        <div id="achList"></div>
      </div>
      <button class="closeSheetBtn" id="closeStats">关闭</button>
    </div>
  </div>

  <div id="genOverlay">
    <div class="spinner"></div>
    <p id="genText">正在生成题目…</p>
  </div>

  <div id="tutOverlay">
    <div id="tutCard">
      <div class="step" id="tutStep">1 / 3</div>
      <h3 id="tutTitle"></h3>
      <p id="tutText"></p>
      <div id="tutDots"></div>
      <button class="primaryBtn" id="tutNext">下一步</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script>
(function(){
  "use strict";

  /* ===================== storage helpers ===================== */
  const hasStorage = !!(window.storage && window.storage.get);
  async function storeGet(key){
    if(!hasStorage) return null;
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
  }
  async function storeSet(key, value){
    if(!hasStorage) return;
    try{ await window.storage.set(key, value, false); }catch(e){}
  }

  /* ===================== toast ===================== */
  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 1800);
  }

  /* ===================== sound / vibration ===================== */
  let audioCtx = null;
  function playTone(freqs, dur){
    if(!settings.sound) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      let t = audioCtx.currentTime;
      freqs.forEach((f,i)=>{
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0.0001, t+i*dur);
        g.gain.exponentialRampToValueAtTime(0.06, t+i*dur+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t+i*dur+dur*0.9);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t+i*dur); o.stop(t+i*dur+dur);
      });
    }catch(e){}
  }
  function vibrate(pattern){ if(settings.vibration && navigator.vibrate) try{navigator.vibrate(pattern);}catch(e){} }
  const sfx = {
    tap: ()=>playTone([440],0.05),
    error: ()=>{ playTone([220,180],0.09); vibrate(40); },
    win: ()=>{ playTone([523,659,784,1046],0.12); vibrate([40,60,40,60,120]); },
    hint: ()=>playTone([660,880],0.08)
  };

  /* ===================== seeded RNG ===================== */
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed>>>15), 1 | seed);
      t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
      return ((t ^ (t>>>14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h = (Math.imul(h,31) + s.charCodeAt(i))|0; } return h>>>0; }
  function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  /* ===================== sudoku engine ===================== */
  function shuffledRange(n, rng){
    rng = rng || Math.random;
    const a = Array.from({length:n}, (_,i)=>i+1);
    for(let i=a.length-1;i>0;i--){ const j=(rng()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function rc(idx){ return [ (idx/9)|0, idx%9 ]; }
  function peersOf(idx){
    const [r,c] = rc(idx); const br=r-r%3, bc=c-c%3; const set=new Set();
    for(let i=0;i<9;i++){ set.add(r*9+i); set.add(i*9+c); }
    for(let dr=0;dr<3;dr++) for(let dc=0;dc<3;dc++) set.add((br+dr)*9+(bc+dc));
    set.delete(idx); return [...set];
  }
  const PEERS = Array.from({length:81},(_,i)=>peersOf(i));
  function isValidPlacement(board, idx, val){ for(const p of PEERS[idx]) if(board[p]===val) return false; return true; }
  function fillBoard(board, rng){
    const idx = board.indexOf(0); if(idx===-1) return true;
    for(const n of shuffledRange(9, rng)){
      if(isValidPlacement(board, idx, n)){ board[idx]=n; if(fillBoard(board, rng)) return true; board[idx]=0; }
    }
    return false;
  }
  function generateSolved(rng){ const board = new Array(81).fill(0); fillBoard(board, rng); return board; }
  function countSolutions(board, limit){
    let count=0;
    function solve(b){
      if(count>=limit) return;
      const idx = b.indexOf(0);
      if(idx===-1){ count++; return; }
      for(let n=1;n<=9;n++){ if(isValidPlacement(b, idx, n)){ b[idx]=n; solve(b); b[idx]=0; if(count>=limit) return; } }
    }
    solve(board.slice()); return count;
  }
  const DIFF_GIVENS = { easy:40, medium:32, hard:28, expert:24 };
  const DIFF_LABEL = { easy:'简单', medium:'中等', hard:'困难', expert:'专家' };
  const DIFF_TECHNIQUES = {
    easy:['唯一候选数','排除法'], medium:['唯一候选数','隐性唯一数','数对'],
    hard:['数对','数组','隐性数对'], expert:['数组','X-Wing','高级排除链']
  };
  function generatePuzzle(diff, rng){
    const solution = generateSolved(rng);
    const puzzle = solution.slice();
    const order = shuffledRange(81, rng).map(x=>x-1);
    const target = DIFF_GIVENS[diff] || 32;
    let filled = 81;
    for(const idx of order){
      if(filled <= target) break;
      const backup = puzzle[idx]; puzzle[idx] = 0;
      const sols = countSolutions(puzzle, 2);
      if(sols !== 1) puzzle[idx] = backup; else filled--;
    }
    return { puzzle, solution };
  }

  /* ===================== settings & stats ===================== */
  let settings = { theme:'light', sound:true, vibration:true, errorCheck:true, autoNotes:false, highContrast:false, fontScale:1 };
  let stats = { totalCompleted:0, mistakesTotal:0, streakDays:0, lastPlayedDate:'', bestTimes:{}, board:{easy:[],medium:[],hard:[],expert:[]}, achievements:[], dailyLastDone:'' };
  const ACHIEVEMENTS = [
    {id:'first_win', t:'初次通关', d:'完成第一局数独', icon:'🎉', check:s=>s.totalCompleted>=1},
    {id:'ten_wins', t:'渐入佳境', d:'累计完成 10 局', icon:'🔥', check:s=>s.totalCompleted>=10},
    {id:'hundred_wins', t:'数独大师', d:'累计完成 100 局', icon:'👑', check:s=>s.totalCompleted>=100},
    {id:'streak_7', t:'持之以恒', d:'连续 7 天挑战', icon:'📅', check:s=>s.streakDays>=7},
    {id:'expert_win', t:'高手过招', d:'通关一局专家难度', icon:'🧠', check:(s,ctx)=>ctx&&ctx.difficulty==='expert'},
    {id:'no_mistake', t:'完美通关', d:'零错误完成一局', icon:'✨', check:(s,ctx)=>ctx&&ctx.mistakes===0},
    {id:'daily_win', t:'每日挑战者', d:'完成一次每日挑战', icon:'🌟', check:(s,ctx)=>ctx&&ctx.isDaily}
  ];
  function userLevelLabel(count){
    if(count>=50) return '大师';
    if(count>=10) return '进阶';
    return '新手';
  }

  async function loadSettings(){
    const s = await storeGet('sudoku-settings');
    if(s){ try{ Object.assign(settings, JSON.parse(s)); }catch(e){} }
  }
  async function saveSettings(){ storeSet('sudoku-settings', JSON.stringify(settings)); }
  async function loadStats(){
    const s = await storeGet('sudoku-stats');
    if(s){ try{ Object.assign(stats, JSON.parse(s)); }catch(e){} }
  }
  async function saveStats(){ storeSet('sudoku-stats', JSON.stringify(stats)); }

  /* ===================== game state ===================== */
  let state = null;
  let timerId = null;
  let isDailyGame = false;

  function emptyNotes(){ return Array.from({length:81}, ()=>new Array(9).fill(false)); }
  function newState(diff, puzzle, solution){
    return { difficulty:diff, board:puzzle.slice(), given:puzzle.map(v=>v!==0), solution:solution.slice(),
      notes:emptyNotes(), history:[], redoStack:[], selected:-1, opMode:'normal', quickArmed:0,
      seconds:0, hintsUsed:0, mistakes:0, finished:false, paused:false };
  }
  function serialize(s){
    return JSON.stringify({ difficulty:s.difficulty, board:s.board, given:s.given, solution:s.solution,
      notes:s.notes, seconds:s.seconds, hintsUsed:s.hintsUsed, mistakes:s.mistakes, isDaily:isDailyGame });
  }
  function deserialize(json){
    const d = JSON.parse(json);
    return { difficulty:d.difficulty, board:d.board, given:d.given, solution:d.solution, notes:d.notes,
      history:[], redoStack:[], selected:-1, opMode:'normal', quickArmed:0,
      seconds:d.seconds||0, hintsUsed:d.hintsUsed||0, mistakes:d.mistakes||0, finished:false, paused:false, _isDaily:d.isDaily };
  }
  let saveTimeout = null;
  function persist(){
    if(!state || state.finished) return;
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(()=> storeSet('sudoku-save', serialize(state)), 400);
  }

  /* ===================== DOM refs ===================== */
  const startScreen = document.getElementById('startScreen');
  const gameScreen = document.getElementById('gameScreen');
  const boardEl = document.getElementById('board');
  const keypadEl = document.getElementById('keypad');
  const timerEl = document.getElementById('timer');
  const diffLabelEl = document.getElementById('diffLabel');
  const continueBtn = document.getElementById('continueBtn');
  const modeBtn = document.getElementById('modeBtn');
  const genOverlay = document.getElementById('genOverlay');
  const winOverlay = document.getElementById('winOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');

  /* ===================== board rendering ===================== */
  function buildBoardDom(){
    boardEl.innerHTML = '';
    for(let i=0;i<81;i++){
      const cell = document.createElement('div');
      cell.className = 'cell'; cell.dataset.idx = i; cell.setAttribute('role','gridcell');
      cell.addEventListener('click', ()=> onCellTap(i));
      boardEl.appendChild(cell);
    }
  }
  function buildKeypad(){
    keypadEl.innerHTML = '';
    for(let n=1;n<=9;n++){
      const b = document.createElement('button');
      b.className = 'numBtn'; b.textContent = n; b.dataset.n = n;
      b.addEventListener('click', ()=> onKeypadTap(n));
      keypadEl.appendChild(b);
    }
  }
  function computeCandidates(i){
    if(state.board[i]) return [];
    const used = new Set(PEERS[i].map(p=>state.board[p]).filter(Boolean));
    const out = [];
    for(let n=1;n<=9;n++) if(!used.has(n)) out.push(n);
    return out;
  }
  function renderCell(i){
    const el = boardEl.children[i];
    const val = state.board[i];
    el.classList.toggle('given', state.given[i]);
    if(val){
      el.innerHTML = `<span class="val">${val}</span>`;
    } else {
      const manual = state.notes[i];
      if(manual.some(Boolean)){
        let html = '<div class="noteGrid">';
        for(let n=1;n<=9;n++) html += `<span>${manual[n-1] ? n : ''}</span>`;
        html += '</div>'; el.innerHTML = html;
      } else if(settings.autoNotes){
        const cand = new Set(computeCandidates(i));
        let html = '<div class="noteGrid auto">';
        for(let n=1;n<=9;n++) html += `<span>${cand.has(n) ? n : ''}</span>`;
        html += '</div>'; el.innerHTML = html;
      } else { el.innerHTML = ''; }
    }
    el.classList.toggle('error', settings.errorCheck && !!val && hasConflict(i));
  }
  function renderAllCells(){ for(let i=0;i<81;i++) renderCell(i); }
  function hasConflict(i){ const v = state.board[i]; if(!v) return false; return PEERS[i].some(p => state.board[p]===v); }

  function updateHighlights(){
    const sel = state.selected;
    const selVal = sel>=0 ? state.board[sel] : 0;
    const peerSet = sel>=0 ? new Set(PEERS[sel]) : new Set();
    for(let i=0;i<81;i++){
      const el = boardEl.children[i];
      el.classList.remove('peer','same-number','selected');
      if(sel>=0 && i===sel) el.classList.add('selected');
      else if(peerSet.has(i)) el.classList.add('peer');
      if(selVal && state.board[i]===selVal) el.classList.add('same-number');
    }
  }
  function updateKeypad(){
    const counts = new Array(10).fill(0);
    for(const v of state.board) if(v) counts[v]++;
    for(const btn of keypadEl.children){
      const n = +btn.dataset.n;
      btn.classList.toggle('done', counts[n]>=9);
      btn.classList.toggle('armed', state.opMode==='quick' && state.quickArmed===n);
    }
  }
  function updateToolbarState(){
    undoBtn.disabled = state.history.length===0;
    redoBtn.disabled = state.redoStack.length===0;
    modeBtn.classList.toggle('active', state.opMode!=='normal');
    const icons = {normal:'✎', notes:'📝', quick:'⚡'};
    const labels = {normal:'普通', notes:'笔记', quick:'快速'};
    modeBtn.querySelector('.ic').textContent = icons[state.opMode];
    modeBtn.childNodes[modeBtn.childNodes.length-1].textContent = labels[state.opMode];
  }

  /* ===================== interactions ===================== */
  function onCellTap(i){
    if(!state || state.finished || state.paused) return;
    if(state.opMode==='quick' && state.quickArmed && !state.given[i]){
      placeValue(i, state.quickArmed);
      return;
    }
    state.selected = i;
    updateHighlights();
  }
  function onKeypadTap(n){
    if(!state || state.finished || state.paused) return;
    sfx.tap();
    if(state.opMode==='quick'){
      state.quickArmed = (state.quickArmed===n) ? 0 : n;
      updateKeypad();
      return;
    }
    const i = state.selected;
    if(i<0){ toast('请先选择一个格子'); return; }
    if(state.given[i]) return;
    if(state.opMode==='notes'){
      const before = state.notes[i].slice();
      state.notes[i][n-1] = !state.notes[i][n-1];
      state.history.push({type:'note', idx:i, before}); state.redoStack=[];
      renderCell(i); persist();
    } else {
      placeValue(i, n);
    }
  }
  function placeValue(i, n){
    const beforeVal = state.board[i], beforeNotes = state.notes[i].slice();
    if(beforeVal === n) return;
    state.board[i] = n; state.notes[i] = new Array(9).fill(false);
    const wrong = n !== state.solution[i];
    if(wrong){ state.mistakes++; sfx.error(); } else { sfx.tap(); }
    state.history.push({type:'value', idx:i, beforeVal, beforeNotes}); state.redoStack=[];
    const el = boardEl.children[i]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    renderAllCells(); updateHighlights(); updateKeypad(); updateToolbarState(); persist(); checkWin();
  }
  function eraseCell(){
    if(!state || state.finished || state.paused) return;
    const i = state.selected;
    if(i<0 || state.given[i]) return;
    if(!state.board[i] && !state.notes[i].some(Boolean)) return;
    state.history.push({type:'value', idx:i, beforeVal:state.board[i], beforeNotes:state.notes[i].slice()}); state.redoStack=[];
    state.board[i] = 0; state.notes[i] = new Array(9).fill(false);
    renderAllCells(); updateHighlights(); updateKeypad(); updateToolbarState(); persist();
  }
  function undo(){
    if(!state || state.finished || state.paused) return;
    const h = state.history.pop(); if(!h) return;
    if(h.type==='value'){
      state.redoStack.push({type:'value', idx:h.idx, afterVal:state.board[h.idx], afterNotes:state.notes[h.idx].slice()});
      state.board[h.idx]=h.beforeVal; state.notes[h.idx]=h.beforeNotes;
    } else {
      state.redoStack.push({type:'note', idx:h.idx, after:state.notes[h.idx].slice()});
      state.notes[h.idx]=h.before;
    }
    renderAllCells(); updateHighlights(); updateKeypad(); updateToolbarState(); persist();
  }
  function redo(){
    if(!state || state.finished || state.paused) return;
    const h = state.redoStack.pop(); if(!h) return;
    if(h.type==='value'){
      state.history.push({type:'value', idx:h.idx, beforeVal:state.board[h.idx], beforeNotes:state.notes[h.idx].slice()});
      state.board[h.idx]=h.afterVal; state.notes[h.idx]=h.afterNotes;
    } else {
      state.history.push({type:'note', idx:h.idx, before:state.notes[h.idx].slice()});
      state.notes[h.idx]=h.after;
    }
    renderAllCells(); updateHighlights(); updateKeypad(); updateToolbarState(); persist(); checkWin();
  }
  function cycleMode(){
    const order = ['normal','notes','quick'];
    state.opMode = order[(order.indexOf(state.opMode)+1)%order.length];
    state.quickArmed = 0;
    updateToolbarState(); updateKeypad();
  }
  function giveHint(){
    if(!state || state.finished || state.paused) return;
    let i = state.selected;
    if(i<0 || state.given[i] || state.board[i]===state.solution[i]){
      i = state.board.findIndex((v,idx)=> v!==state.solution[idx]);
      if(i<0) return;
    }
    state.history.push({type:'value', idx:i, beforeVal:state.board[i], beforeNotes:state.notes[i].slice()}); state.redoStack=[];
    state.board[i] = state.solution[i]; state.notes[i] = new Array(9).fill(false);
    state.hintsUsed++; state.selected = i; sfx.hint();
    const el = boardEl.children[i]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    renderAllCells(); updateHighlights(); updateKeypad(); updateToolbarState(); persist(); checkWin();
  }
  function manualCheck(){
    if(!state) return;
    let wrong = 0;
    for(let i=0;i<81;i++) if(state.board[i] && state.board[i]!==state.solution[i]) wrong++;
    toast(wrong===0 ? '目前填写全部正确' : `发现 ${wrong} 处错误`);
  }
  function revealAnswer(){
    if(!state) return;
    for(let i=0;i<81;i++){ state.board[i]=state.solution[i]; state.notes[i]=new Array(9).fill(false); }
    state.finished = true; stopTimer(); renderAllCells(); updateHighlights(); updateKeypad(); updateToolbarState();
    storeSet('sudoku-save','');
    toast('已显示完整答案，本局不计入统计');
  }

  async function checkWin(){
    for(let i=0;i<81;i++) if(state.board[i]!==state.solution[i]) return;
    state.finished = true; stopTimer(); sfx.win();
    storeSet('sudoku-save', '');
    await recordCompletion();
    document.getElementById('winTime').textContent = formatTime(state.seconds);
    document.getElementById('winHints').textContent = state.hintsUsed;
    document.getElementById('winMistakes').textContent = state.mistakes;
    setTimeout(()=>{ winOverlay.style.display = 'flex'; }, 260);
  }

  async function recordCompletion(){
    const diff = state.difficulty;
    stats.totalCompleted++;
    stats.mistakesTotal += state.mistakes;
    const today = todayKey();
    if(stats.lastPlayedDate === today){ /* same day, streak unchanged */ }
    else {
      const y = new Date(); y.setDate(y.getDate()-1);
      const yKey = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
      stats.streakDays = (stats.lastPlayedDate === yKey) ? stats.streakDays+1 : 1;
      stats.lastPlayedDate = today;
    }
    if(!stats.bestTimes[diff] || state.seconds < stats.bestTimes[diff]) stats.bestTimes[diff] = state.seconds;
    stats.board[diff] = stats.board[diff] || [];
    stats.board[diff].push({time:state.seconds, mistakes:state.mistakes, date:today});
    stats.board[diff].sort((a,b)=>a.time-b.time);
    stats.board[diff] = stats.board[diff].slice(0,5);
    if(isDailyGame) stats.dailyLastDone = today;

    const ctx = {difficulty:diff, mistakes:state.mistakes, isDaily:isDailyGame};
    const newlyUnlocked = [];
    for(const a of ACHIEVEMENTS){
      if(!stats.achievements.includes(a.id) && a.check(stats, ctx)){
        stats.achievements.push(a.id); newlyUnlocked.push(a);
      }
    }
    await saveStats();
    document.getElementById('winAch').textContent = newlyUnlocked.length ? '🏅 解锁成就：' + newlyUnlocked.map(a=>a.t).join('、') : '';
  }

  function shareResult(){
    const text = `完成${DIFF_LABEL[state.difficulty]}数独\n用时：${formatTime(state.seconds)}\n错误：${state.mistakes}次`;
    if(navigator.share){ navigator.share({text}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('成绩已复制到剪贴板')); }
    else toast(text);
  }

  /* ===================== timer ===================== */
  function formatTime(s){ const m=(s/60)|0, sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
  function startTimer(){
    stopTimer(); timerEl.textContent = formatTime(state.seconds);
    timerId = setInterval(()=>{
      if(state.finished || state.paused) return;
      state.seconds++; timerEl.textContent = formatTime(state.seconds);
      if(state.seconds % 5 === 0) persist();
    }, 1000);
  }
  function stopTimer(){ if(timerId) clearInterval(timerId); timerId = null; }
  function togglePause(){
    if(!state || state.finished) return;
    state.paused = !state.paused;
    pauseOverlay.style.display = state.paused ? 'flex' : 'none';
  }
  pauseOverlay.addEventListener('click', ()=>{ if(state && state.paused) togglePause(); });

  /* ===================== screens ===================== */
  function applyOpModeUI(){ document.querySelectorAll('#opModeSeg button').forEach(b=> b.classList.toggle('on', b.dataset.v===state.opMode)); }
  function showGame(){
    startScreen.style.display = 'none'; gameScreen.style.display = 'flex';
    diffLabelEl.textContent = (isDailyGame ? '每日挑战 · ' : '') + (DIFF_LABEL[state.difficulty] || '');
    renderAllCells(); updateHighlights(); updateKeypad(); updateToolbarState(); applyOpModeUI();
    pauseOverlay.style.display = 'none';
    startTimer();
    maybeShowTutorial();
  }
  function showStart(){ stopTimer(); gameScreen.style.display = 'none'; startScreen.style.display = 'flex'; refreshUserLevel(); }

  async function startNewGame(diff, daily){
    isDailyGame = !!daily;
    genOverlay.style.display = 'flex';
    document.getElementById('genText').textContent = daily ? '正在生成今日题目…' : '正在生成题目…';
    await new Promise(r=>setTimeout(r, 30));
    let rng = Math.random, useDiff = diff;
    if(daily){ useDiff = 'medium'; rng = mulberry32(hashStr('sudoku-daily-'+todayKey())); }
    const { puzzle, solution } = generatePuzzle(useDiff, rng);
    state = newState(useDiff, puzzle, solution);
    genOverlay.style.display = 'none';
    showGame(); persist();
  }

  /* ===================== theme / accessibility ===================== */
  function applyTheme(t){
    settings.theme = t;
    document.documentElement.dataset.theme = t;
    const icon = t === 'dark' ? '☀️' : (t==='mono' ? '◐' : '🌙');
    document.getElementById('themeToggleStart').textContent = icon;
    document.querySelectorAll('#themeSeg button').forEach(b=> b.classList.toggle('on', b.dataset.v===t));
    saveSettings();
  }
  function cycleThemeQuick(){
    const order = ['light','dark','mono'];
    applyTheme(order[(order.indexOf(settings.theme)+1)%order.length]);
  }
  function applyAccessibility(){
    document.documentElement.classList.toggle('hc', !!settings.highContrast);
    document.documentElement.style.setProperty('--fontScale', settings.fontScale);
    document.getElementById('hcSwitch').classList.toggle('on', !!settings.highContrast);
    document.querySelectorAll('#fontSeg button').forEach(b=> b.classList.toggle('on', +b.dataset.v===settings.fontScale));
  }
  function applyToggleSwitches(){
    document.getElementById('soundSwitch').classList.toggle('on', settings.sound);
    document.getElementById('vibSwitch').classList.toggle('on', settings.vibration);
    document.getElementById('errSwitch').classList.toggle('on', settings.errorCheck);
    document.getElementById('autoSwitch').classList.toggle('on', settings.autoNotes);
  }

  /* ===================== stats / achievements UI ===================== */
  function refreshUserLevel(){
    document.getElementById('userLevel').textContent = `${userLevelLabel(stats.totalCompleted)} · 已完成 ${stats.totalCompleted} 局`;
  }
  function renderStatsScreen(){
    document.getElementById('stTotal').textContent = stats.totalCompleted;
    document.getElementById('stStreak').textContent = stats.streakDays;
    document.getElementById('stMistakes').textContent = stats.mistakesTotal;
    const bt = document.getElementById('bestTimesList');
    bt.innerHTML = ['easy','medium','hard','expert'].map(d=>
      `<div class="lbRow"><span>${DIFF_LABEL[d]}</span><span>${stats.bestTimes[d]!=null ? formatTime(stats.bestTimes[d]) : '—'}</span></div>`
    ).join('');
    renderLeaderboard(currentLbDiff);
    const ach = document.getElementById('achList');
    ach.innerHTML = ACHIEVEMENTS.map(a=>{
      const unlocked = stats.achievements.includes(a.id);
      return `<div class="achRow ${unlocked?'unlocked':''}"><div class="dot">${a.icon}</div><div><div class="t">${a.t}</div><div class="d">${a.d}</div></div></div>`;
    }).join('');
  }
  let currentLbDiff = 'easy';
  function renderLeaderboard(diff){
    currentLbDiff = diff;
    document.querySelectorAll('#lbDiffSeg button').forEach(b=> b.classList.toggle('on', b.dataset.v===diff));
    const list = stats.board[diff] || [];
    const lb = document.getElementById('lbList');
    lb.innerHTML = list.length ? list.map((r,i)=>
      `<div class="lbRow"><span class="rank">#${i+1}</span><span>${formatTime(r.time)}</span><span style="color:var(--muted)">${r.mistakes} 错 · ${r.date}</span></div>`
    ).join('') : '<div style="color:var(--muted); font-size:13px; padding:6px 0;">暂无记录，完成一局后会出现在这里</div>';
  }

  /* ===================== tutorial ===================== */
  const TUT_STEPS = [
    {t:'点击选格', d:'轻触棋盘上的空格选中它，再从下方数字盘点击数字即可填入。'},
    {t:'使用候选笔记', d:'切换到「笔记」模式后填入的数字会作为候选记录在格子角落，方便推理。'},
    {t:'检查与提示', d:'菜单里可以随时「检查」当前填写是否正确，卡住时点「提示」会帮你填一个格子。'}
  ];
  let tutIdx = 0;
  function maybeShowTutorial(){
    storeGet('sudoku-tutorial-seen').then(seen=>{
      if(seen) return;
      tutIdx = 0; renderTutStep();
      document.getElementById('tutOverlay').style.display = 'flex';
    });
  }
  function renderTutStep(){
    const s = TUT_STEPS[tutIdx];
    document.getElementById('tutStep').textContent = `${tutIdx+1} / ${TUT_STEPS.length}`;
    document.getElementById('tutTitle').textContent = s.t;
    document.getElementById('tutText').textContent = s.d;
    document.getElementById('tutDots').innerHTML = TUT_STEPS.map((_,i)=>`<span class="${i===tutIdx?'on':''}"></span>`).join('');
    document.getElementById('tutNext').textContent = (tutIdx===TUT_STEPS.length-1) ? '开始游戏' : '下一步';
  }

  /* ===================== wire up ===================== */
  buildBoardDom(); buildKeypad();

  document.querySelectorAll('.diff-btn').forEach(btn=> btn.addEventListener('click', ()=> startNewGame(btn.dataset.diff, false)));
  document.getElementById('dailyBtn').addEventListener('click', ()=>{
    if(stats.dailyLastDone === todayKey()){ toast('今日挑战已完成，明天再来～'); }
    startNewGame(null, true);
  });
  document.getElementById('backBtn').addEventListener('click', ()=>{ persist(); showStart(); refreshContinueButton(); });
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);
  document.getElementById('eraseBtn').addEventListener('click', eraseCell);
  modeBtn.addEventListener('click', cycleMode);
  document.getElementById('hintBtn').addEventListener('click', giveHint);
  document.getElementById('winNewGame').addEventListener('click', ()=>{ winOverlay.style.display='none'; startNewGame(state.difficulty, isDailyGame); });
  document.getElementById('winShare').addEventListener('click', shareResult);

  continueBtn.addEventListener('click', async ()=>{
    const saved = await storeGet('sudoku-save');
    if(saved){ state = deserialize(saved); isDailyGame = !!state._isDaily; showGame(); }
  });

  // menu sheet
  const menuOverlay = document.getElementById('menuOverlay');
  document.getElementById('menuBtn').addEventListener('click', ()=>{ applyOpModeUI(); menuOverlay.style.display='flex'; });
  document.getElementById('closeMenu').addEventListener('click', ()=> menuOverlay.style.display='none');
  document.getElementById('pauseBtn').addEventListener('click', ()=>{ togglePause(); menuOverlay.style.display='none'; });
  document.getElementById('checkBtn').addEventListener('click', ()=>{ manualCheck(); menuOverlay.style.display='none'; });
  document.getElementById('revealBtn').addEventListener('click', ()=>{ menuOverlay.style.display='none'; revealAnswer(); });
  document.getElementById('settingsBtnGame').addEventListener('click', ()=>{ menuOverlay.style.display='none'; openSettings(); });
  document.querySelectorAll('#opModeSeg button').forEach(b=> b.addEventListener('click', ()=>{
    state.opMode = b.dataset.v; state.quickArmed = 0; applyOpModeUI(); updateToolbarState(); updateKeypad();
  }));

  // settings sheet
  const settingsOverlay = document.getElementById('settingsOverlay');
  function openSettings(){ applyToggleSwitches(); applyAccessibility(); document.querySelectorAll('#themeSeg button').forEach(b=> b.classList.toggle('on', b.dataset.v===settings.theme)); settingsOverlay.style.display='flex'; }
  document.getElementById('settingsBtnStart').addEventListener('click', openSettings);
  document.getElementById('closeSettings').addEventListener('click', ()=> settingsOverlay.style.display='none');
  document.querySelectorAll('#themeSeg button').forEach(b=> b.addEventListener('click', ()=> applyTheme(b.dataset.v)));
  document.querySelectorAll('#fontSeg button').forEach(b=> b.addEventListener('click', ()=>{ settings.fontScale=+b.dataset.v; applyAccessibility(); saveSettings(); }));
  document.getElementById('soundSwitch').addEventListener('click', ()=>{ settings.sound=!settings.sound; applyToggleSwitches(); saveSettings(); });
  document.getElementById('vibSwitch').addEventListener('click', ()=>{ settings.vibration=!settings.vibration; applyToggleSwitches(); saveSettings(); });
  document.getElementById('errSwitch').addEventListener('click', ()=>{ settings.errorCheck=!settings.errorCheck; applyToggleSwitches(); saveSettings(); if(state) renderAllCells(); });
  document.getElementById('autoSwitch').addEventListener('click', ()=>{ settings.autoNotes=!settings.autoNotes; applyToggleSwitches(); saveSettings(); if(state) renderAllCells(); });
  document.getElementById('hcSwitch').addEventListener('click', ()=>{ settings.highContrast=!settings.highContrast; applyAccessibility(); saveSettings(); });
  document.getElementById('themeToggleStart').addEventListener('click', cycleThemeQuick);

  // stats sheet
  const statsOverlay = document.getElementById('statsOverlay');
  document.getElementById('statsBtn').addEventListener('click', ()=>{ renderStatsScreen(); statsOverlay.style.display='flex'; });
  document.getElementById('closeStats').addEventListener('click', ()=> statsOverlay.style.display='none');
  document.querySelectorAll('#lbDiffSeg button').forEach(b=> b.addEventListener('click', ()=> renderLeaderboard(b.dataset.v)));

  // tutorial
  document.getElementById('tutNext').addEventListener('click', ()=>{
    if(tutIdx < TUT_STEPS.length-1){ tutIdx++; renderTutStep(); }
    else { document.getElementById('tutOverlay').style.display='none'; storeSet('sudoku-tutorial-seen','1'); }
  });

  // close modals by tapping backdrop
  [settingsOverlay, menuOverlay, statsOverlay].forEach(ov=>{
    ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.style.display='none'; });
  });
  winOverlay.addEventListener('click', (e)=>{ /* keep explicit buttons only */ });

  document.addEventListener('keydown', (e)=>{
    if(gameScreen.style.display !== 'flex') return;
    if(e.key >= '1' && e.key <= '9') onKeypadTap(+e.key);
    else if(e.key === 'Backspace' || e.key === 'Delete') eraseCell();
    else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey) undo();
    else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.shiftKey && e.key.toLowerCase()==='z'))) redo();
  });

  async function refreshContinueButton(){
    const saved = await storeGet('sudoku-save');
    if(saved){
      try{
        const d = JSON.parse(saved);
        continueBtn.style.display = 'block';
        continueBtn.textContent = `继续上局 · ${DIFF_LABEL[d.difficulty]||''} · ${formatTime(d.seconds||0)}`;
      }catch(e){ continueBtn.style.display = 'none'; }
    } else { continueBtn.style.display = 'none'; }
  }

  /* ===================== boot ===================== */
  (async function init(){
    await loadSettings(); await loadStats();
    applyTheme(settings.theme || 'light');
    applyAccessibility(); applyToggleSwitches();
    refreshUserLevel();
    await refreshContinueButton();
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  })();

})();
</script>
</body>
</html>
